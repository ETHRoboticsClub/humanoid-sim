# PACE 0.2.0's actuator model on the plant: the physics round-trip test, then the self-test (parameters planted
# in the sim, a synthetic chirp recorded on a fixed base, and fitted back). With BAGS set, it then fits the
# mounted recordings (rosbag2 or exc-* directories), the first fitted, the rest held out. Mount them as
# sysid.sky.yaml does, e.g. file_mounts: {/data/low: ../datasets/humanoid-v1/<bag>}, and set BAGS to the paths.
#   sky launch -y -c hsim-bench -i 10 sky/pace.sky.yaml
#   rsync -avz hsim-bench:sky_workdir/outputs/sysid/ outputs/sysid/
name: humanoid-sim-pace
workdir: .

resources:
  cloud: aws
  accelerators: L40S:1
  cpus: 8+
  memory: 32+
  disk_size: 200

envs:
  ISAACLAB_COMMIT: 32712682b69edd488eea26689da6905c48d31037
  UV_VERSION: 0.13.1
  NUM_ENVS: "512"
  GENERATIONS: "40"
  DURATION: "20"
  SEARCH: blocks  # or joint: one CMA-ES over every parameter, as PACE searches
  BAGS: ""  # e.g. "/data/low /data/high": the first is fitted, the others held out

setup: bash sky/setup.sh
run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$HOME/il-venv/bin:$PATH"
  cd "$HOME/sky_workdir"
  humanoid-sim build-asset | tail -1
  humanoid-sim build-asset --base-joints | tail -1
  mkdir -p outputs/sysid/pace-selftest
  uv pip install -q --python "$HOME/il-venv/bin/python" "pytest>=9,<10"
  python -m pytest -m physics -k pace -q 2>&1 | tee outputs/sysid/pace-selftest/physics-test.log | tail -3
  humanoid-sim pace-selftest --num-envs "$NUM_ENVS" --generations "$GENERATIONS" --duration "$DURATION" \
    --device cuda:0 --search "$SEARCH" --out "outputs/sysid/pace-selftest-$SEARCH" 2>&1 | tee "outputs/sysid/pace-selftest-$SEARCH.log" \
    | { grep -E '^gen|^objective|^\{' || true; }
  if [ -n "$BAGS" ]; then
    set -- $BAGS
    first=$1; shift
    mkdir -p outputs/sysid/pace
    humanoid-sim fit-pace "$first" --holdout "$@" --num-envs "$NUM_ENVS" --generations "$GENERATIONS" \
      --duration "$DURATION" --device cuda:0 --search "$SEARCH" --out outputs/sysid/pace 2>&1 | tee outputs/sysid/pace/fit-pace.log \
      | { grep -E '^gen|rebuilt|^\{' || true; }
  fi
