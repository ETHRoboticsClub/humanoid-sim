name: humanoid-sim-native-usd
workdir: .

resources:
  accelerators: L4:1
  cpus: 8+
  memory: 32+
  disk_size: 150

envs:
  ISAACLAB_COMMIT: 32712682b69edd488eea26689da6905c48d31037
  UV_VERSION: 0.13.1

setup: |
  bash sky/setup.sh
  "$HOME/.local/bin/uv" pip install --python "$HOME/il-venv/bin/python" "pytest>=9,<10"

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$HOME/il-venv/bin:$PATH"
  python -c 'import torch; assert torch.cuda.is_available(), "CUDA is required for native physics checks"'
  humanoid-sim build-asset
  humanoid-sim build-asset --base-joints
  humanoid-sim build-asset --ankle-compliance
  mkdir -p outputs/native-usd
  # One pytest process per file: Isaac Lab keeps one simulation per process, and a test that fails while building one
  # would leave it to every later test of the same process.
  failed=0
  for f in test_native_usd test_native_integration test_description_delivery test_native_parameters test_native_physics \
      test_ankle_compliance test_ankle_compliance_physics; do
    pytest -v -s --junitxml="outputs/native-usd/$f.xml" "tests/$f.py" > "outputs/native-usd/$f.log" 2>&1 || failed=1
    echo "$f: $(tail -1 "outputs/native-usd/$f.log")"
  done
  exit $failed
