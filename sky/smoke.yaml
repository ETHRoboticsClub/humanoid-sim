# Uses an already-built image available to the remote Docker host. No source
# workdir is synced and no registry is assumed. Set HUMANOID_SIM_IMAGE explicitly.
name: humanoid-sim-newton-smoke
resources:
  any_of:
    - accelerators: L4:1
    - accelerators: A10G:1
  cpus: 4+
  memory: 16+
  disk_size: 100
envs:
  HUMANOID_SIM_IMAGE: null
  SMOKE_STEPS: '120'
setup: |
  set -euo pipefail
  : "${HUMANOID_SIM_IMAGE:?Set a built image reference accessible to this host}"
  docker info >/dev/null
  docker pull "$HUMANOID_SIM_IMAGE"
run: |
  set -euo pipefail
  : "${HUMANOID_SIM_IMAGE:?Set a built image reference accessible to this host}"
  result_dir="$HOME/humanoid-sim-runs/${SKYPILOT_TASK_ID:-smoke}"
  mkdir -p "$result_dir"
  # Image runs as uid/gid 1000; prepare only this task's new output directory.
  sudo chown 1000:1000 "$result_dir"
  docker run --rm --gpus all --shm-size=2g \
    -e NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics \
    -v humanoid-sim-warp-cache:/home/isaaclab/.cache/warp \
    -v "$result_dir:/runs" \
    "$HUMANOID_SIM_IMAGE" \
    smoke --backend isaac --headless --steps "$SMOKE_STEPS" --output-dir /runs/smoke
  echo "Smoke artifacts: $result_dir/smoke"
