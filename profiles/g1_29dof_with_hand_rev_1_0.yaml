# Plant modeling choices for the Unitree G1 29-DoF rev 1.0 with hands (the G1 Controls launches), merged over
# profiles/defaults.yaml. Robot facts are NOT here: they come from third_party/humanoid-urdf/g1_29dof_with_hand_rev_1_0.
schema: humanoid-sim-profile/v1
robot: g1_29dof_with_hand_rev_1_0

# home: Unitree's deploy standing pose, slightly bent knees (position-presets.yaml standing-init-v1, which
# Controls' ethrc_ssot/standing_pose.py also uses).
model:
  # Each foot touches the ground with four 5 mm spheres of the URDF. The sole box bounds them (it describes the
  # sole for the runtime truth and adds no collision).
  sole:
    joints: {l: left_ankle_roll_joint, r: right_ankle_roll_joint}
    fit: bounds
  # Arms collide with legs and with each other, legs with each other, so the hands stop at the hips as on the
  # robot. Within a set and against the trunk nothing collides: the URDF's hulls of neighbouring links overlap at
  # rest. A set is every body at or below its joint; pelvis, waist and torso are `rest`.
  self_collision:
    sets: {arm_l: left_shoulder_pitch_joint, arm_r: right_shoulder_pitch_joint,
           leg_l: left_hip_pitch_joint, leg_r: right_hip_pitch_joint}
    rest: trunk
    pairs: [[arm_l, leg_l], [arm_r, leg_r], [arm_l, leg_r], [arm_r, leg_l], [arm_l, arm_r], [leg_l, leg_r]]

poses:
  home: {preset: standing-init-v1}
  # Runtime sessions start in Unitree's zero pose: the standing pose, every joint at 0 on the G1.
  start: standing

support:
  # The lab's straps hold the torso at the shoulders (Controls ethrc_sim unitree_plant.py HARNESS_BODY, SHOULDER_LINKS).
  harness: {body: torso_link, shoulders: [left_shoulder_pitch_link, right_shoulder_pitch_link]}
