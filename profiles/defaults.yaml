# Defaults every robot's profile is merged over (load_profile): profiles/<robot>.yaml overrides them key by key, and
# a robot without a profile file runs on these alone. Robot facts are NOT here: they come from third_party/humanoid-urdf.
schema: humanoid-sim-profile/v1

model:
  # The URDF to build, relative to the robot's ament package. Default: the one actuators.yaml names.
  # Movable URDF joints without an actuators.yaml entry are welded at zero.
  weld_unlisted_joints: true
  # One convex hull per body (see model/urdf.py); per_mesh makes one hull per URDF collision mesh.
  collision_hulls: per_body
  # Friction of the flat ground.
  ground_friction: 1.0
  # No sole boxes (model.sole), contact excludes (model.contact_excludes) or self-collision sets
  # (model.self_collision) unless the robot's profile names them.

# Named poses (model/poses.py). home: zero (the URDF's zero) or {preset: <preset_id in position-presets.yaml>}.
poses:
  home: zero
  # The pose every runtime session starts in (`serve --pose` overrides): home or standing.
  start: home

# Drive feedback as reported. Without devices.encoders the training plant reports exact values.
devices: {}

physics:
  period_ns: 4000000          # 250 Hz
  # Newton solver stepping the robot: mjwarp or kamino. Each has its own block below.
  solver: mjwarp
  self_collision: true
  mjwarp:
    integrator: implicitfast  # implicit in the damping: stable with the stiff ankle-crank PD at 4 ms
    cone: pyramidal
    iterations: 100
    ls_iterations: 50
    # Buffers. nconmax is a per-world average (the contact pool is shared by all worlds), njmax a per-world
    # maximum. With per-body hulls a standing robot needs about 30 contacts, a fallen one up to about 390
    # constraint rows. MJWarp prints an overflow warning when either runs out.
    njmax: 400
    nconmax: 64
    # Joint stops: MuJoCo's own limit constraint (solref 0.02 s, damping ratio 1), as Controls' MJCF has it.
    # Newton's force-space default (1e4 Nm/rad) is softer for the legs: 40 Nm on the hip abduction sinks 11 mrad
    # past its stop (under 2 mrad here), and Controls' range survey found that stop 4 mrad out. The real stops'
    # stiffness is not measured (modeled).
    joint_limits: mujoco
    # Ankle stops of a robot with crank linkages (the V1): cranks or hinges. cranks: each crank's measured stop
    # (the description's position_limit, the ankle's only limit) as a solver constraint, one spatial tendon per crank
    # and stop from the stopped crank's rod ball to the rod's foot ball, limited to the rod's length
    # (physics/crank_stops.py), on top of the hinges' box. hinges: the box alone, the axis hull of what the stops
    # allow, whose corners need a crank past its stop (driven there, the V1's cranks go 0.5 rad past their stops).
    ankle_stops: cranks
    # The stops' constraint (MuJoCo solref: time constant s, damping ratio). Twice the 4 ms period, the stiffest
    # MuJoCo's solver keeps stable (its XML reference, solref; it raises anything shorter to that): a crank pushed
    # with its 22 Nm/rad baseline spring 1 rad past a stop rests 13 mrad past it (52 mrad at the joint stops' 0.02 s).
    # The real stops are metal; their stiffness is not measured (modeled).
    ankle_stop_solref: [0.008, 1.0]
    # Depth of the solid base under a heightfield's lowest point. Newton exports heightfields to MuJoCo with a
    # 0.1 mm base, through which a shape sinking into the lowest cells is pushed out downwards (a G1 foot sphere
    # landing on a rough tile falls through). Deeper than any shape sinks; nothing lies under the terrain.
    heightfield_base_m: 1.0
    # Collision detection: newton (Newton's collision pipeline, its contacts handed to MJWarp) or mujoco (MJWarp's
    # own). MJWarp's own pipeline now and then returns a sole box against a heightfield prism metres deep (the V1's
    # sole boxes at -2 to -7.6 m, about 5,400 times per million policy steps of a training rollout), and the
    # solver pushes that contact out in one step: the robot spins at up to 54 rad/s. It also keeps at most 50 prisms
    # per shape pair. Newton's pipeline gave no such contact or spin in the same rollouts (docs/world.md).
    contacts: newton
  # Kamino (beta in Newton 1.6): maximal coordinates, hard joint-limit and contact constraints, P-ADMM forward
  # dynamics, contacts from Newton's collision pipeline. Contact friction mixes by the larger coefficient, as
  # MJWarp does. Not yet checked against MJWarp or the captures (modeled).
  kamino:
    integrator: euler  # moreau needs Kamino's own collision detector
    iterations: 100
    # Contact buffer per world, the same for every world; Newton drops contacts beyond it. An estimate (about
    # 100 contacts for a fallen robot, from MJWarp's constraint rows), not counted on Kamino.
    max_contacts_per_world: 128

solver_gains: baseline        # constant per-episode PD = the description's baseline gains

# The lab gantry a suspended session hangs from (runtime/host.py): one cable from the harness hook, the midpoint of
# the shoulders on the harness body, to an anchor overhead, critically damped for the robot's mass. Overhead and
# full-weight stretch are the test hypotheses of Controls' G1 gantry (ethrc_integration_tests g1_walk_scenario.py),
# not gantry measurements.
support:
  harness: null               # {body, shoulders: [l, r]}; the robot's profile names it
  overhead_m: 1.25
  full_weight_stretch_m: 0.02
