# Plant modeling choices for humanoid-v1 (ETHRC V1), merged over profiles/defaults.yaml. Robot facts are NOT here: they come from
# third_party/humanoid-urdf. The `model` and `devices` blocks below hold facts that live only in Controls
# code; each names its source.
schema: humanoid-sim-profile/v1
robot: ethrc_v1

# Named poses (model/poses.py). Zero is the delivered CAD pose, not a balanced stance.
poses:
  home: zero
  # Standing uses the description offsets; training chooses its own starting pose.
  start: standing

model:
  # The CAD delivery is imported directly; the URDF is only a Controls identity artifact.
  usd: usd/humanoid_V1.usda
  weld_unlisted_joints: true
  # Preserve the delivered crank/rod loops; only uncommanded hand joints are welded.
  ankle_representation: native
  collision_hulls: per_mesh
  # Hand joints are welded above: shapes within each resulting rigid assembly
  # must not generate self-contacts between its non-adjacent component bodies.
  exclude_fixed_cluster_contacts: true
  # Convex hulls fill the interlocking housings across these compound joints.
  # Exclude their internal assembly contacts, retaining contacts with other bodies.
  contact_excludes:
    # Waist axial rotation + lateral bending.
    - [base_link, hej90_hip_abduction_1]
    # Ankle universal joints (the delivered CAD body names are not side labels).
    - [bottom_universal_joint_l_1, universal_joint_connector_l_1]
    - [WB71803_Kugelzapfen_WB71802_C16_ST_1, universal_joint_connector_l_Mirror_1]
    # Hip flexion + abduction housings.
    - [hej90_hip_abduction_1, hej90_leg_abduction_l_1]
    - [hej90_hip_abduction_1, hej90_leg_abduction_r_1]
  sole:
    joints: {l: ankle_inversion_l, r: ankle_inversion_r}
    box_thickness_m: 0.005
    face_depth_m: 0.001
  ground_friction: 1.0

devices:
  # Output encoder resolution per drive family: the counts every reported position is in (Controls
  # ethercat_device_configurator bus_config/device_configurations/maxon*.yaml
  # Hardware.position_encoder_resolution @ 447b4acb).
  encoders:
    HEJ90-48-140: {counts_per_revolution: 4096}
    HEJ70-48-50: {counts_per_revolution: 16384}
    HEJ50-48-30: {counts_per_revolution: 16384}

solver_gains: baseline        # constant per-episode PD = humanoid-urdf baseline_position_gains (native ankle shafts use crank gains)

physics:
  # Resolve the light native rods and their closed-loop constraints at 1 kHz.
  # Policy/control periods are configured independently by the caller.
  period_ns: 1000000
  mjwarp:
    # Contact can spin a rod about its long axis. RK4 resolves that rotational
    # motion without the energy growth of the single-step integrators.
    integrator: rk4
    # Numerical loop compliance, separate from the measured actuator gains.
    loop_closure_solref: [0.002, 1.0]
    loop_closure_solimp: [0.99, 0.999, 0.001, 0.5, 2.0]
    # Allow headroom for native per-mesh contacts when environments fall;
    # the legacy per-body hull budget is too small for this geometry.
    # Reserve 512 contacts/world on average and four pyramidal friction rows per
    # contact, plus 256 rows for native loops, joint limits and uneven contact load.
    nconmax: 512
    njmax: 2304
  kamino:
    # NativeState supplies every crank and ball coordinate consistently. Preserve
    # that state through tree FK rather than re-solving it with regularized FK.
    use_fk_solver: false
    collapse_fixed_joints: true
    # Keep the direct operator within int32 indexing at 4096 worlds. The plant
    # checks actual contacts on device and stops rather than silently dropping any.
    max_contacts_per_world: 144
    sparse_jacobian: true
    sparse_dynamics: false
    dynamics_solver: padmm
    linear_solver: LLTB
    linear_solver_kwargs: {}
    padmm: {rho_0: 0.05}
    # Keep PADMM iterations as CUDA graph loops instead of unrolling
    # every iteration into a graph too large for the native 4096-world batch.
    use_graph_conditionals: true

support:
  harness: {body: base_link, shoulders: [shoulder_connector_l_1, shoulder_connector_r_1]}
