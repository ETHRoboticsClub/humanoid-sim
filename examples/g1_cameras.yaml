# Cameras to add to the G1's rig for the RTX sensors (examples/rtx_sensors.py --sensors): not the G1's rig. Its
# profile declares only the body IMU and the Mid-360 (profiles/g1_29dof_with_hand_rev_1_0.yaml); these are the
# cameras the lab G1 is reported to carry, at the description's camera links, until its rig declares them.
sensors:
  zed:
    model: zed-mini
    frame: camera0_camera   # the helmet mount: the left eye's optical centre (humanoid-urdf PROVENANCE.md)
    # HD720 at 30 Hz as Controls' zed backend opens it, with the factory calibration of the lab's unit (SN19945568,
    # as Controls' test_zed_backend.py carries it): fisheye (equidistant) lenses, the right eye's place from [STEREO]
    # (Baseline 62.8272 mm, TY -0.181381 mm, TZ 0.233734 mm, placed as zed_backend.parse_calibration places it).
    width: 1280
    height: 720
    frame_period_ns: 33333333
    intrinsics:
      left: [771.4, 771.14, 629.115, 353.0685]
      right: [772.01, 771.55, 641.75, 346.6085]
    distortion:
      left: {model: equidistant, coefficients: [-0.0358597, 0.0185157, -0.00496448, 0.00194007]}
      right: {model: equidistant, coefficients: [-0.0368591, 0.0234426, -0.0128113, 0.00625172]}
    stream_offsets_m:
      right: [0.000233734, -0.0628272, 0.000181381]
  d435:
    model: realsense-d435i
    frame: d435_link        # Unitree's d435_joint on the torso
    # 640 x 480 at 30 Hz as Controls' realsense adapter opens it. No unit's calibration: centred pinholes with the
    # datasheet's fields of view, colour 69 deg across (fx = 320 / tan(34.5 deg)), the infrared imagers and depth
    # 87 x 58 deg (fx = 320 / tan(43.5 deg), fy = 240 / tan(29 deg)).
    width: 640
    height: 480
    frame_period_ns: 33333333
    intrinsics:
      rgb: [465.6029, 465.6029, 320.0, 240.0]
      mono_left: [337.2096, 432.9715, 320.0, 240.0]
      mono_right: [337.2096, 432.9715, 320.0, 240.0]
      depth: [337.2096, 432.9715, 320.0, 240.0]
