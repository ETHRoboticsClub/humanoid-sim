name: CI
on: [push, pull_request]
jobs:
  cpu-contracts:
    # Device layer, transmissions, model build, readers and host kinematics (Newton): no Isaac Lab.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --python 3.12 --extra dev --extra newton
      - run: uv run ruff check src tests spikes examples docs
      - run: uv run pytest -m "not physics and not data"
  isaaclab-image:
    # Builds the Isaac Lab image, the robot assets, and runs the physics tests on the CPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - run: docker build -f docker/Dockerfile -t humanoid-sim:ci .
      - run: |
          docker run --rm -v "$PWD":/workspace/humanoid-sim -w /workspace/humanoid-sim humanoid-sim:ci build-asset
          docker run --rm -v "$PWD":/workspace/humanoid-sim -w /workspace/humanoid-sim humanoid-sim:ci build-asset --base-joints
          docker run --rm -v "$PWD":/workspace/humanoid-sim -w /workspace/humanoid-sim humanoid-sim:ci \
            pytest -m physics
  controls-pins:
    # humanoid-urdf and ankle_kinematics must be at the commits Controls pins on CONTROLS_REF (a repository
    # variable; default master).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
          CONTROLS_REF: ${{ vars.CONTROLS_REF || 'master' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::no SUBMODULES_TOKEN: Controls' pins not checked"; exit 0; fi
          fail=0
          check() {  # our submodule, Controls' path to the same repository
            ours=$(git ls-tree HEAD "$1" | awk '{print $3}')
            theirs=$(gh api "repos/ETHRoboticsClub/ETHRC-Humanoid-Controls/contents/$2?ref=$CONTROLS_REF" --jq .sha)
            if [ "$ours" = "$theirs" ]; then
              echo "$1 = $ours"
            else
              echo "::error::$1 is at $ours; Controls ($CONTROLS_REF) pins $theirs"
              fail=1
            fi
          }
          check third_party/humanoid-urdf ros2_ws/src/description/URDF_5_description
          check third_party/ankle_kinematics ros2_ws/src/drivers/ankle_kinematics
          exit $fail
