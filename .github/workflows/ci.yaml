# CI on GitHub-hosted runners only: humanoid-sim is public, so no self-hosted runner may ever serve it. Details: docs/ci.md.
#
# humanoid-urdf (a private submodule) and ETHRC-Humanoid-Controls are read with a short-lived token from the "ETHRC CI read"
# GitHub App (variable CI_READ_APP_ID, secret CI_READ_PRIVATE_KEY). Pull requests from forks and from Dependabot get no secrets,
# so the jobs that need the token are skipped for them and ci-ok fails with instructions.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filter as a job, so the workflow always reports and ci-ok can be a required check. Docs-only changes
    # (Markdown, docs/images) leave code=false and skip the test jobs. Also decides whether this run has secrets.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      secrets: ${{ steps.filter.outputs.secrets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_SECRETS: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          echo "secrets=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ -z "$BASE_SHA" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # On a pull request HEAD is the merge commit; its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -qvE '\.md$|^docs/images/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  cpu-contracts:
    # Device layer, transmissions, model build, readers and host kinematics (Newton): no Isaac Lab. x86, where the locked
    # usd-core has wheels.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_PRIVATE_KEY }}
          owner: ETHRoboticsClub
          repositories: humanoid-urdf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          lfs: false
          persist-credentials: false
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
      - name: Install
        run: uv sync --locked --python 3.12 --extra dev --extra newton --extra kinematics-check --extra viz --extra bag
      - name: Lint
        # master has 16 existing ruff findings (import order, semicolons in tests/kamino_reduced_fixture.py, one lambda,
        # one unused import), so the step reports without failing the job. Remove continue-on-error once they are fixed.
        continue-on-error: true
        run: uv run --no-sync ruff check src tests spikes examples docs
      - run: uv run --no-sync pytest -m "not physics and not data"

  controls-pins:
    # humanoid-urdf must be at the commit Controls pins on CONTROLS_REF (a repository variable; default master).
    # Controls is read through the GitHub API with a token for that repository only.
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_PRIVATE_KEY }}
          owner: ETHRoboticsClub
          repositories: ETHRC-Humanoid-Controls
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CONTROLS_REF: ${{ vars.CONTROLS_REF || 'master' }}
        run: |
          if ! printf '%s' "$CONTROLS_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::CONTROLS_REF must match ^[A-Za-z0-9._/-]+\$"
            exit 1
          fi
          fail=0
          check() {  # our submodule, Controls' path to the same repository
            ours=$(git ls-tree HEAD "$1" | awk '{print $3}')
            theirs=$(gh api "repos/ETHRoboticsClub/ETHRC-Humanoid-Controls/contents/$2?ref=$CONTROLS_REF" --jq .sha)
            if [ -n "$ours" ] && [ "$ours" = "$theirs" ]; then
              echo "$1 = $ours"
            else
              echo "::error::$1 is at $ours; Controls ($CONTROLS_REF) pins $theirs"
              fail=1
            fi
          }
          check third_party/humanoid-urdf ros2_ws/src/description/humanoid-urdf
          exit $fail

  ci-ok:
    # The one check to require: passes when the test jobs pass or were skipped by the path filter.
    needs: [changes, cpu-contracts, controls-pins]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.cpu-contracts.result }} ${{ needs.controls-pins.result }}
          CODE: ${{ needs.changes.outputs.code }}
          HAS_SECRETS: ${{ needs.changes.outputs.secrets }}
        run: |
          echo "changes, cpu-contracts, controls-pins: $RESULTS"
          case " $RESULTS " in *failure*|*cancelled*) exit 1;; esac
          set -- $RESULTS
          test "$1" = success
          if [ "$CODE" = true ] && [ "$HAS_SECRETS" != true ]; then
            echo "::error::This pull request comes from a fork or from Dependabot, which get no repository secrets, so the tests that read the private humanoid-urdf submodule did not run. A maintainer reviews the diff and pushes the branch to ETHRoboticsClub/humanoid-sim; that runs the full CI as a same-repository pull request."
            exit 1
          fi
