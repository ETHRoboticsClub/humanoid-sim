name: CI
on: [push, pull_request]
jobs:
  cpu-contracts:
    # Device layer, transmissions, model build, readers: no Isaac Lab, no Newton.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: false
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
      - run: uv sync --python 3.12 --extra dev --extra newton
      - run: uv run ruff check src tests spikes
      - run: uv run pytest -m "not physics and not data"
  isaaclab-image:
    # Builds the Isaac Lab image, the robot asset, and runs the physics tests on the CPU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - run: docker build -f docker/Dockerfile -t humanoid-sim:ci .
      - run: |
          docker run --rm -v "$PWD":/workspace/humanoid-sim -w /workspace/humanoid-sim humanoid-sim:ci build-asset
          docker run --rm -v "$PWD":/workspace/humanoid-sim -w /workspace/humanoid-sim humanoid-sim:ci \
            bash -c "uv pip install -q --python /opt/isaaclab-venv/bin/python pytest && pytest -m physics"
