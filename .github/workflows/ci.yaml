# CI on the self-hosted Spark runner (labels: self-hosted, linux, arm64, spark). Setup: docs/ci.md.
#
# The runner user holds read-only deploy keys, not GitHub secrets. ~/.ssh/config on the Spark:
#   Host github-humanoid-urdf
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/deploy_humanoid_urdf
#     IdentitiesOnly yes
#   Host github-humanoid-sim
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/deploy_humanoid_sim
#     IdentitiesOnly yes
#   Host github-controls
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/deploy_controls
#     IdentitiesOnly yes
# and github.com in ~/.ssh/known_hosts. The humanoid-urdf and github-controls aliases are used in this repository.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Job-scoped git config (not global): the submodule URLs go through the deploy key alias.
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: url.github-humanoid-urdf:ETHRoboticsClub/humanoid-urdf.git.insteadOf
  GIT_CONFIG_VALUE_0: git@github.com:ETHRoboticsClub/humanoid-urdf.git
  GIT_CONFIG_KEY_1: url.github-humanoid-urdf:ETHRoboticsClub/humanoid-urdf.git.insteadOf
  GIT_CONFIG_VALUE_1: https://github.com/ETHRoboticsClub/humanoid-urdf.git

jobs:
  changes:
    # Path filter as a job, so the workflow always reports and ci-ok can be a required check. Docs-only changes
    # (Markdown, docs/images) leave code=false and skip the test jobs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, arm64, spark]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 2
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # On a pull request HEAD is the merge commit; its first parent is the base.
          if git diff --name-only HEAD^1 HEAD | grep -qvE '\.md$|^docs/images/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Clean the workspace
        if: always()
        run: git clean -ffdx || true

  cpu-contracts:
    # Device layer, transmissions, model build, readers and host kinematics (Newton): no Isaac Lab.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, arm64, spark]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Submodules
        run: git submodule update --init --recursive
      - run: uv --version
      - name: Install
        # uv.lock pins usd-core 26.8, which has no linux aarch64 wheel; 26.11 does.
        run: |
          uv sync --python 3.12 --extra dev --extra newton --extra kinematics-check --extra viz --extra bag --no-install-package usd-core
          uv pip install -q "usd-core>=26.11"
      - run: uv run --no-sync ruff check src tests spikes examples docs
      - run: uv run --no-sync pytest -m "not physics and not data"
      - name: Clean the workspace
        if: always()
        run: git clean -ffdx || true

  controls-pins:
    # humanoid-urdf must be at the commit Controls pins on CONTROLS_REF (a repository variable; default master).
    # Controls is read with its own read-only deploy key (alias github-controls): a shallow fetch of the ref and
    # git ls-tree. Controls' submodules are not initialised.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, arm64, spark]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - env:
          CONTROLS_REF: ${{ vars.CONTROLS_REF || 'master' }}
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          git -C "$tmp" fetch -q --depth 1 github-controls:ETHRoboticsClub/ETHRC-Humanoid-Controls.git "$CONTROLS_REF"
          fail=0
          check() {  # our submodule, Controls' path to the same repository
            ours=$(git ls-tree HEAD "$1" | awk '{print $3}')
            theirs=$(git -C "$tmp" ls-tree FETCH_HEAD "$2" | awk '{print $3}')
            if [ -n "$ours" ] && [ "$ours" = "$theirs" ]; then
              echo "$1 = $ours"
            else
              echo "::error::$1 is at $ours; Controls ($CONTROLS_REF) pins $theirs"
              fail=1
            fi
          }
          check third_party/humanoid-urdf ros2_ws/src/description/humanoid-urdf
          exit $fail
      - name: Clean the workspace
        if: always()
        run: git clean -ffdx || true

  ci-ok:
    # The one check to require: passes when the test jobs pass or were skipped by the path filter.
    needs: [changes, cpu-contracts, controls-pins]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, arm64, spark]
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.cpu-contracts.result }} ${{ needs.controls-pins.result }}
        run: |
          echo "changes, cpu-contracts, controls-pins: $RESULTS"
          case " $RESULTS " in *failure*|*cancelled*) exit 1;; esac
          set -- $RESULTS
          test "$1" = success
