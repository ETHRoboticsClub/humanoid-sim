name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests scripts/install-uv.py
      - run: pytest
      - run: python -m build
      - name: Test installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          humanoid-sim smoke --backend cpu --steps 120
