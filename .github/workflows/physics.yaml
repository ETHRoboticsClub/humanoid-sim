# Physics lane, a placeholder for now. The Spark runner is a Kubernetes pod without Docker and the GB10 GPUs are
# scarce, so CI does not run physics. Triggers: the `physics` label on a pull request and workflow_dispatch (no
# nightly). The job prints how to run the physics tests on SkyPilot and exits 0. Running them from CI is a follow-up.
# Setup: see https://github.com/ETHRoboticsClub/humanoid-sim/blob/master/docs/ci.md
name: Physics

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.label.name == 'physics')
    runs-on: [self-hosted, linux, arm64, spark]
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::Physics tests do not run in CI yet. Run them on a SkyPilot GPU node: sky launch -y -d -c hsim-e2e -i 10 sky/e2e.sky.yaml"
          echo "See docs/ci.md in humanoid-sim, section 'Physics on SkyPilot'."
