name: humanoid-sim

x-runtime: &runtime
  image: ${HUMANOID_SIM_IMAGE:-humanoid-sim:isaaclab-b9a673a-newton}
  build:
    context: .
  init: true
  shm_size: 2gb
  environment:
    NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    WARP_CACHE_PATH: /home/isaaclab/.cache/warp
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  volumes: &volumes
    - warp-cache:/home/isaaclab/.cache/warp
    - uv-cache:/home/isaaclab/.cache/uv
    - runs:/runs

services:
  sim:
    <<: *runtime
    command: [smoke, --backend, isaac, --headless, --steps, '120', --output-dir, /runs/smoke]
  dev:
    <<: *runtime
    profiles: [dev]
    environment:
      HUMANOID_SIM_DEV: '1'
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      WARP_CACHE_PATH: /home/isaaclab/.cache/warp
    volumes:
      - warp-cache:/home/isaaclab/.cache/warp
      - uv-cache:/home/isaaclab/.cache/uv
      - runs:/runs
      - .:/workspace/humanoid-sim
    command: [smoke, --backend, isaac, --headless, --steps, '120', --output-dir, /runs/dev-smoke]
  viewer:
    <<: *runtime
    profiles: [viewer]
    ports:
      - '127.0.0.1:${HUMANOID_SIM_VIEWER_PORT:-8080}:8080'
    # Five minutes at the default 400 us physics period. No per-step trace is
    # buffered during this longer inspection session.
    command: [smoke, --backend, isaac, --visualizer, viser, --viewer-host, 0.0.0.0, --viewer-port, '8080', --realtime, --steps, '750000']

volumes:
  warp-cache:
  uv-cache:
  runs:
