[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-sim"
version = "0.1.0"
description = "Batched HEJ device models and an Isaac Lab Newton integration"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.11.0", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18", "build>=1.4,<2"]

[project.scripts]
humanoid-sim = "humanoid_sim.cli:main"

[tool.setuptools]
packages = ["humanoid_sim"]
package-dir = {humanoid_sim = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
